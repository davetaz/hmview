<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product List</title>
  <link rel="stylesheet" href="../style/dark.css" />
  <link rel="stylesheet" href="../style/jquery.dataTables.min.css" />
  <style>
    table img {
      max-height: 40px;
    }
    td, th {
      vertical-align: middle;
    }
    body {
      max-width: 90%;
      margin: auto;
    }
    .breadcrumb {
      font-size: 1.4rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .breadcrumb a {
      color: #90caf9;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
   <nav class="breadcrumb">
        <a href="/">Home</a> &gt; <span id="breadcrumbSku">Products</span>
      </nav>
  <h1>Product List</h1>
  <table id="productsTable">
    <thead>
      <tr>
        <th>SKU</th>
        <th>Title</th>
        <th>Image</th>
        <th>Scale</th>
        <th>Function Count</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="../js/jquery.dataTables.min.js"></script>
  <script type="module">
    const table = document.getElementById('productsTable').querySelector('tbody');

    fetch('../data/products.json')
      .then(res => res.json())
      .then(products => {
        // Sort SD-prefixed SKUs first, then alphabetically
        products.sort((a, b) => {
          const aSD = a.project_suite_sku.startsWith('SD');
          const bSD = b.project_suite_sku.startsWith('SD');

          if (aSD && !bSD) return -1;
          if (!aSD && bSD) return 1;

          return a.project_suite_sku.localeCompare(b.project_suite_sku, 'en', { numeric: true });
        });

        for (const product of products) {
          const sku = product.project_suite_sku || '';
          const title = product.title || '';
          const imgHTML = product.img ? `<img src="../${product.img}" alt="${sku}">` : '';

          let scaleDisplay = product.product_item_scale;
          if (scaleDisplay === '0.12') {
            scaleDisplay = 'TT:120';
          } else if (scaleDisplay === '0.76') {
            scaleDisplay = '00';
          }

          const fnCount = product.functions ? Object.keys(product.functions).length : 0;
          const link = `<a href="${sku}.html">View</a>`;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${sku}</td>
            <td>${title}</td>
            <td>${imgHTML}</td>
            <td>${scaleDisplay}</td>
            <td>${fnCount}</td>
            <td>${link}</td>
          `;
          table.appendChild(row);
        }

        new DataTable('#productsTable', {
          paging: true,
          searching: true,
          info: true,
          responsive: true,
          pageLength: 50,
          order: [[3, 'asc']] // Default sort by Scale column (index 3)
        });
      });
  </script>
</body>
</html>
